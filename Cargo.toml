[package]
name = "ps4emu"
version = "0.1.0"
edition = "2021"
description = "Экспериментальный эмулятор PlayStation 4 (Orbis OS / x86-64) на Rust"
license = "MIT"
readme = "README.md"

[lib]
name = "ps4emu"
path = "src/lib.rs"

[[bin]]
name = "ps4emu"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
