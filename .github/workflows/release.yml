name: Release

# Сборка релизных артефактов под Linux и Windows и прикрепление их к GitHub Release.
# Запуск: вручную (workflow_dispatch с указанием тега) или по push тега v*.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Два события (push тега и ручной запуск) могут прийти одновременно —
# выстраиваем их в очередь, иначе прогоны дерутся за вложения одного релиза.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Общая проверка: тесты гоняем один раз на Linux.
  test:
    name: Тесты (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Определить тег
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --release --offline

  build:
    name: Сборка (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux
            bin: ps4emu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-windows
            bin: ps4emu.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Определить тег
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Сборка
        run: cargo build --release --offline --target ${{ matrix.target }}

      - name: Проверка бинаря
        shell: bash
        run: |
          set -euo pipefail
          "./target/${{ matrix.target }}/release/${{ matrix.bin }}" self-test

      - name: Упаковать
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          DIR="ps4emu-${TAG}-${SUFFIX}"
          rm -rf dist
          mkdir -p "dist/$DIR/docs" "dist/$DIR/guests"
          cp "target/${TARGET}/release/${BIN}" "dist/$DIR/"
          cp README.md Cargo.toml Cargo.lock "dist/$DIR/"
          cp docs/screenshot.png "dist/$DIR/docs/" 2>/dev/null || true
          cp tests/guests/*.S "dist/$DIR/guests/"
          # Краткая инструкция для конечного пользователя.
          {
            echo "ps4emu ${TAG} (${SUFFIX})"
            echo
            echo "Исполняемый файл: ${BIN}"
            echo "  Windows: ps4emu.exe --help   (cmd/PowerShell или двойной клик)"
            echo "  Linux:   ./ps4emu --help"
            echo
            echo "Быстрая проверка:  ${BIN} self-test"
            echo "Запуск гостя:      ${BIN} run <файл.elf> --trace"
            echo "Снимок кадра:      ${BIN} screenshot <elf> shot.bmp"
            echo "Снимки состояния:  ${BIN} snapshot save <elf> state.snap"
            echo
            echo "Примеры гостевых программ — в каталоге guests/."
            echo "Сборка примеров (нужен gcc):"
            echo "  gcc -static -nostdlib -o hello.elf guests/hello.S"
            echo "  gcc -shared -nostdlib -fPIC -o video.so guests/video.S"
            echo
            echo "Подробности и ограничения — в README.md."
          } > "dist/$DIR/ЗАПУСК.txt"
          tar -czf "dist/${DIR}.tar.gz" -C dist "$DIR"
          # zip собираем через стандартный python (есть и на Linux, и на Windows),
          # чтобы не зависеть от утилиты zip.
          python - "$DIR" <<'PYEOF'
          import os, sys, zipfile
          name = sys.argv[1]
          root = os.path.join("dist", name)
          with zipfile.ZipFile(os.path.join("dist", name + ".zip"), "w", zipfile.ZIP_DEFLATED) as z:
              for base, _dirs, files in os.walk(root):
                  for f in files:
                      full = os.path.join(base, f)
                      z.write(full, os.path.relpath(full, "dist"))
          PYEOF
          ls -lh dist

      - name: Приложить к релизу
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          upload() {
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$@" --clobber; then
                return 0
              fi
              echo "загрузка не удалась (попытка $attempt), повтор через 10 с"
              sleep 10
            done
            return 1
          }
          upload "dist/ps4emu-${TAG}-${{ matrix.suffix }}.tar.gz" \
                 "dist/ps4emu-${TAG}-${{ matrix.suffix }}.zip"

  sources:
    name: Исходники и README
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Определить тег
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Архив исходников
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          git archive --format=tar.gz --prefix="ps4emu-${TAG}-src/" \
            -o "ps4emu-${TAG}-src.tar.gz" "$TAG"
          git archive --format=zip --prefix="ps4emu-${TAG}-src/" \
            -o "ps4emu-${TAG}-src.zip" "$TAG"
          ls -lh ps4emu-${TAG}-src.*

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          upload() {
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$@" --clobber; then
                return 0
              fi
              echo "загрузка не удалась (попытка $attempt), повтор через 10 с"
              sleep 10
            done
            return 1
          }
          upload "ps4emu-${TAG}-src.tar.gz" \
                 "ps4emu-${TAG}-src.zip" \
                 README.md
